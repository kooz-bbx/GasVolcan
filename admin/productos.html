<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Administrar Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body data-proteger-admin>
    <div class="container">
        <header>
            <h1><i class="bi bi-speedometer2"></i> Panel Administrador</h1>
            <p>Gestión de Productos</p>
        </header>

        <div class="admin-layout">
            <aside class="admin-sidebar">
                <div class="admin-logo"><i class="bi bi-fire"></i> Gas El Volcán</div>
                <a href="index.html"><i class="bi bi-house-door"></i> Home</a>
                <a href="productos.html" class="active"><i class="bi bi-box-seam"></i> Productos</a>
                <a href="usuarios.html"><i class="bi bi-people"></i> Usuarios</a>
                <a href="#" onclick="cerrarSesion('../index.html'); return false;"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
            </aside>
            <div class="admin-contenido">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <h2><i class="bi bi-box-seam"></i> Productos</h2>
                    <a href="producto-form.html" class="btn-enviar" style="text-decoration:none; display:inline-block;">
                        <i class="bi bi-plus-circle"></i> Nuevo Producto
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered tabla-admin">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Nombre</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos-admin-body">
                            <!-- Se llena dinamicamente con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <footer>
            <i class="bi bi-fire"></i>
            © 2026 - Distribuidora de Gas El Volcán - Panel Administrador
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/datos.js"></script>
    <script src="../js/funciones.js"></script>
</body>
</html>
